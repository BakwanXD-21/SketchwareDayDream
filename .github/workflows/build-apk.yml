name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build SDK 26 and SDK 33 flavors only
        env:
          GRADLE_OPTS: "-Xmx4096m"
        run: |
          chmod +x gradlew
          ./gradlew assembleAndroid26Release assembleAndroid33Release

      - name: List generated APKs
        run: |
          echo "=== Generated APKs ==="
          ls -la app/build/outputs/apk/android26/release/*.apk app/build/outputs/apk/android33/release/*.apk || echo "No APKs found"

      - name: Upload APK Android 26
        uses: actions/upload-artifact@v4
        with:
          name: Sketchware-Android26
          path: app/build/outputs/apk/android26/release/*.apk

      - name: Upload APK Android 33
        uses: actions/upload-artifact@v4
        with:
          name: Sketchware-Android33
          path: app/build/outputs/apk/android33/release/*.apk